          PATH_TO_SAVE_ZIP: '$GRADLE_FOLDER_PATH.zip'
        run: |
          source .github/scripts/helpers.sh
          #
          echo "Downloading '$LATEST_GRADLE_URL' to '$PATH_TO_SAVE_ZIP'..."
          time wget      -q "$LATEST_GRADLE_URL" -O "$PATH_TO_SAVE_ZIP"
          #
          check_folder "/tmp/"
          check_file   "$PATH_TO_SAVE_ZIP"
          #
          echo "Unziping '$PATH_TO_SAVE_ZIP' to '$GRADLE_FOLDER_PATH'..."
          time  unzip -q "$PATH_TO_SAVE_ZIP" -d /tmp/
          #
          check_folder "/tmp/"
          check_folder "$GRADLE_FOLDER_PATH"
          check_folder "$GRADLE_FOLDER_PATH-$LATEST_GRADLE"
          if [ -d "$GRADLE_FOLDER_PATH-$LATEST_GRADLE" ]; then
            mv "$GRADLE_FOLDER_PATH-$LATEST_GRADLE" \
               "$GRADLE_FOLDER_PATH"
            check_folder "$GRADLE_FOLDER_PATH"
            check_folder "$GRADLE_FOLDER_PATH-$LATEST_GRADLE"
          fi

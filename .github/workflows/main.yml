          if [ ! -d "$DIR" ]; then
            echo "'$DIR' folder not found, skipping uploading it to R2."
            exit 1
          fi
          #
          source .github/scripts/helpers.sh
          #
          echo "=== 'r8.json' files in '$DIR' ==="
          find $DIR -type f \( -iname "*r8.json*" \) 2>/dev/null
          echo "================================="
          #
          archive_name="r8.json_in_gh_ws.zip"
          find $DIR -type f \( -iname "*r8.json*" \) | zip $archive_name -@
          #
          time aws s3 cp "$archive_name" "s3://$R2_BUCKET/$ANDROID_VERSION_CODE/$archive_name" --endpoint-url $R2_ENDPOINT --quiet

      - name: 🗜️ Find and upload proguard.txt for ads-mobile-sdk
        continue-on-error: true
        timeout-minutes: 5
        if: always() && steps.buildStep.outcome != 'skipped'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          GH_WORKSPACE: ${{ github.workspace }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          DIR="$GH_WORKSPACE"
          #
          if [ ! -d "$DIR" ]; then
            echo "'$DIR' folder not found, skipping uploading it to R2."
            exit 1
          fi
          #
          source .github/scripts/helpers.sh
          #
          echo "=== '*proguard.txt*' files in '$DIR' ==="
          find $DIR -type f \( -iname "*proguard.txt*" \) 2>/dev/null
          # .gradle/caches/9.5.1/transforms/fab4be94b19d7651db176131e5944978/transformed/jetified-ads-mobile-sdk-1.4.0/proguard.txt
          echo "================================="
          #
          archive_name="proguard_in_gh_ws.zip"
          find $DIR -type f \( -iname "*proguard.txt*" \) | zip $archive_name -@
          #
          time aws s3 cp "$archive_name" "s3://$R2_BUCKET/$ANDROID_VERSION_CODE/$archive_name" --endpoint-url $R2_ENDPOINT --quiet

      - name: Final timestamp
        continue-on-error: true
        timeout-minutes: 1
        if: always()
        run: |
          date -u
          df -h
          free -h || true

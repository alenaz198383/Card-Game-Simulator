        id: patch_gradle_project_for_R8
        if: always() && steps.setup_latest_Gradle.outcome == 'success'
        run: |
          # Меняем владельца на runner
          sudo chown -R runner:runner "$GRADLE_PROJECT"
          #
          source .github/scripts/helpers.sh
          #
          # Обновляем Gradle до latest версии
          check_folder "$GRADLE_PROJECT"
          check_folder "$GRADLE_PROJECT/gradle/"
          check_folder "$GRADLE_PROJECT/gradle/wrapper/"
          cat_file     "$GRADLE_PROJECT/gradle/wrapper/gradle-wrapper.properties"
          sed -i 's|distributionUrl=.*|distributionUrl=https\\://services.gradle.org/distributions/gradle-$LATEST_GRADLE-bin.zip|' \
            "$GRADLE_PROJECT/gradle/wrapper/gradle-wrapper.properties"
          cat_file "$GRADLE_PROJECT/gradle/wrapper/gradle-wrapper.properties"
          #
          # Обновляем AGP до 9.3.0
          cat_file "$GRADLE_PROJECT/build.gradle"
          sed -i "s|id 'com.android.application' version '9.0.1'|id 'com.android.application' version '9.3.0'|" \
            "$GRADLE_PROJECT/build.gradle"
          cat_file "$GRADLE_PROJECT/build.gradle"
          sed -i "s|id 'com.android.library' version '9.0.1'|id 'com.android.library' version '9.3.0'|" \
            "$GRADLE_PROJECT/build.gradle"
          cat_file "$GRADLE_PROJECT/build.gradle"
          #
          echo "=== gradle-wrapper.properties ==="
          cat_file "$GRADLE_PROJECT/gradle/wrapper/gradle-wrapper.properties"
          echo "=== build.gradle ==="
          cat_file "$GRADLE_PROJECT/build.gradle"

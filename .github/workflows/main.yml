          check_folder "$GRADLE_FOLDER_PATH"
          check_folder "$GRADLE_BIN_FOLDER_PATH"
          check_file   "$GRADLE_BIN_PATH"
          #
          if [ ! -f "$GRADLE_BIN_PATH" ]; then

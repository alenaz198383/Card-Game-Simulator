      - name: Fix SDK/NDK paths for R8 analyzer
        continue-on-error: true
        env:
          GH_WORKSPACE: ${{ github.workspace }}
        id: fix_sdk_ndk_paths_for_R8
        if: always() && steps.patch_gradle_project_for_R8.outcome == 'success'
        run: |
          source .github/scripts/helpers.sh
          #
          check_folder "$GRADLE_PROJECT/"
          #
          # Исправляем SDK path
          cat_file "$GRADLE_PROJECT/local.properties"
          echo "sdk.dir=$ANDROID_SDK_ROOT" > "$GRADLE_PROJECT/local.properties"
          cat_file "$GRADLE_PROJECT/local.properties"
          #
          check_folder $ANDROID_SDK_ROOT/ndk/
          # Находим доступный NDK на раннере
          echo "=== $ANDROID_SDK_ROOT/ndk/* ==="
          ls -d     $ANDROID_SDK_ROOT/ndk/* 2>/dev/null
          echo "=== $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V ==="
          ls -d     $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V
          echo "====================================================="
          #NDK_PATH=$(ls -d $ANDROID_SDK_ROOT/ndk/* 2>/dev/null | sort -V | tail -1)
          # Используем конкретно 28.2.x:
          NDK_PATH="/usr/local/lib/android/sdk/ndk/28.2.13676358"
          echo "Found NDK: $NDK_PATH"
          #
          # Патчим ndkPath во ВСЕХ build.gradle
          find "$GRADLE_PROJECT" -name "build.gradle" | while read f; do
            echo "Patching $f..."
            cat_file $f
            sed -i "s|ndkPath \"[^\"]*\"|ndkPath \"$NDK_PATH\"|g" "$f"
            echo "Patched $f."
            cat_file $f
          done
          #
          # Убираем ndkVersion - пусть берёт из найденного NDK
          find "$GRADLE_PROJECT" -name "build.gradle" | while read f; do
            echo "Убираем ndkVersion из $f..."
            cat_file $f
            sed -i '/ndkVersion/d' "$f"
            echo "Patched $f."
            cat_file $f
          done
          #
          # Удаляем ненужные для анализа скрипты символов
          sed -i '/apply from.*setupSymbols/d'     "$GRADLE_PROJECT/launcher/build.gradle"
          sed -i '/apply from.*keepUnitySymbols/d' "$GRADLE_PROJECT/launcher/build.gradle"
          #
          echo "=== local.properties ==="
          cat_file "$GRADLE_PROJECT/local.properties"
          echo "=== build.gradle ==="
          cat_file "$GRADLE_PROJECT/launcher/build.gradle"
          echo "=== ndkPath line ==="
          grep -rn "ndkPath" "$GRADLE_PROJECT" --include="*.gradle" || true
          echo "====================================================="
          echo "=== ndkVersion line ==="
          grep -rn "ndkVersion" "$GRADLE_PROJECT" --include="*.gradle" || true
          echo "====================================================="
          echo "=== apply from lines ===" 
          grep -n "apply from" "$GRADLE_PROJECT/launcher/build.gradle" || true
          echo "====================================================="
          #
          #grep -n  "ndkVersion" "$GRADLE_PROJECT/shared/common.gradle" || true
          #grep -n  "ndkPath"    "$GRADLE_PROJECT/shared/common.gradle" || true
          #grep -rn "ndkVersion" "$GRADLE_PROJECT" 2>/dev/null || true  # без --include, все файлы
          #grep -rn "ndkPath"    "$GRADLE_PROJECT" 2>/dev/null || true  # без --include, все файлы
          #echo "====================================================="
          #
          # Заменяем Docker-путь на реальный путь хост-раннера
          sed -i "s|/github/workspace|$GH_WORKSPACE|g" "$GRADLE_PROJECT/settings.gradle"
          #
          echo "=== settings.gradle maven repos ==="
          grep -A2 "maven" "$GRADLE_PROJECT/settings.gradle"
          #echo "====================================================="


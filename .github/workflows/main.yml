name: Build with GameCI

permissions:
  actions: write # To cancel runs (gh run cancel) and delete the cache
  checks: write
  contents: read # To read the code
  pull-requests: read # To check for PR (gh pr list)

concurrency: unity
env:
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  #FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
  TMP_R8_ANALYSIS_PATH: '/tmp/r8analysis'
  GH_WS_R8PATH: '${{ github.workspace }}/r8analysis'
  GRADLE_OPTS: '-Dcom.android.tools.r8.dumpkeepradiushtmltodirectory=${{ github.workspace }}/r8analysis'
  LATEST_GRADLE: '9.5.1'
  GRADLE_FOLDER_PATH: '/tmp/gradle'
  GRADLE_BIN_FOLDER_PATH: '/tmp/gradle/bin'
  GRADLE_BIN_PATH: '/tmp/gradle/bin/gradle'
  GRADLE_PROJECT: 'Library/Bee/Android/Prj/IL2CPP/Gradle'
  GRADLE_REPORTS_FOLDER: 'Library/Bee/Android/Prj/IL2CPP/Gradle/launcher/build/reports/'
  GRADLE_PROBLEM_REPORT_FOLDER: 'Library/Bee/Android/Prj/IL2CPP/Gradle/build/reports/' # + problems/problems-report.html
  PROJECT_SETTINGS_FILE: 'ProjectSettings/ProjectSettings.asset'
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      use_cached_library:
        description: 'Use cached Library'
        type: boolean
        default: true
      restore_cache_from_R2:
        description: 'Restore cache from R2'
        type: boolean
        default: true
      android_export_type:
        description: 'Android Export Types'
        type: choice
        options:
          - both
          - apk
          - aab
        default: aab
      store_export_type:
        description: 'Store Export Types'
        type: choice
        options:
          - both
          - google
          - rustore
          - choose_one
        default: choose_one
      isProduction:
        description: 'isProduction'
        type: boolean
        default: false
      sentry_size_analysis_enabled:
        description: 'Enable AAB_s Size Analysis in Sentry'
        type: boolean
        default: true
      sentry_debug:
        description: 'Sentry CLI debug logging'
        type: boolean
        default: false
      custom_build_version:
        description: 'Версия сборки (формат 1.2.3)'
        required: false
        type: string
        default: ''

jobs:
  check_secrets:
    name: 🔑🩺 Check GitHub Secrets
    timeout-minutes: 3
    if: |
      !contains(fromJSON('["dependabot", "renovate"]'), github.actor) &&
      !startsWith(github.event.pull_request.title, 'chore(deps') &&
      !startsWith(github.event.pull_request.title, 'fix(deps')
    runs-on: ubuntu-24.04
    # runs-on: self-hosted
    steps:
      - name: 🔑 Check Unity license
        timeout-minutes: 1
        id: checklicense
        env:
          UNITY_SERIAL_PERSONAL: ${{ secrets.UNITY_SERIAL_PERSONAL }}
          UNITY_EMAIL_PERSONAL: ${{ secrets.UNITY_EMAIL_PERSONAL }}
          UNITY_PASSWORD_PERSONAL: ${{ secrets.UNITY_PASSWORD_PERSONAL }}
        run: |
          missing_secrets=""
          [ -z "$UNITY_SERIAL_PERSONAL" ] && missing_secrets="$missing_secrets UNITY_SERIAL_PERSONAL"
          [ -z "$UNITY_EMAIL_PERSONAL" ] && missing_secrets="$missing_secrets UNITY_EMAIL_PERSONAL"
          [ -z "$UNITY_PASSWORD_PERSONAL" ] && missing_secrets="$missing_secrets UNITY_PASSWORD_PERSONAL"
          if [ -z "$missing_secrets" ]; then
            echo "✅ All required 'UNITY_' secrets are present"
          else
            echo "❌ Missing 'UNITY_' secrets:$missing_secrets"
            exit 1
          fi

      - name: 🩺 Check 'ANDROID_' secrets
        timeout-minutes: 1
        id: check_android_secrets
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
        run: |
          missing_secrets=""
          [ -z "$ANDROID_KEYSTORE_BASE64" ] && missing_secrets="$missing_secrets ANDROID_KEYSTORE_BASE64"
          [ -z "$ANDROID_KEYSTORE_PASS" ] && missing_secrets="$missing_secrets ANDROID_KEYSTORE_PASS"
          [ -z "$ANDROID_KEYALIAS_PASS" ] && missing_secrets="$missing_secrets ANDROID_KEYALIAS_PASS"
          if [ -z "$missing_secrets" ]; then
            echo "✅ All required 'ANDROID_' secrets are present"
          else
            echo "❌ Missing 'ANDROID_' secrets:$missing_secrets"
            exit 1
          fi

      - name: 🩺 Check inputs
        timeout-minutes: 1
        env:
          STORE_EXPORT_TYPE: ${{ inputs.store_export_type }}
        run: |
          missing_types=""
          [ -z "$STORE_EXPORT_TYPE" ] && missing_types="$missing_types store_export_type"
          [ "$STORE_EXPORT_TYPE" == "choose_one" ] && missing_types="$missing_types store_export_type"
          if [ -z "$missing_types" ]; then
            echo "✅ All required input types are present"
          else
            echo "❌ Missing input types:$missing_types"
            exit 1
          fi

  buildAndroid:
    name: 🦺 Build ${{ matrix.exportMode }} for Android (${{ matrix.store }})
    runs-on: ubuntu-24.04
    needs: [check_secrets]
    strategy:
      fail-fast: false
      matrix:
        exportMode: ${{ (github.event_name == 'workflow_dispatch' && inputs.android_export_type == 'apk' && fromJSON('["apk"]')) || (github.event_name == 'workflow_dispatch' && inputs.android_export_type == 'aab' && fromJSON('["aab"]')) || fromJSON('["apk", "aab"]') }}
        store: ${{ (github.event_name == 'workflow_dispatch' && inputs.store_export_type == 'google' && fromJSON('["google"]')) || (github.event_name == 'workflow_dispatch' && inputs.store_export_type == 'rustore' && fromJSON('["rustore"]')) || fromJSON('["google", "rustore"]') }}
    outputs:
      buildVersion: ${{ steps.buildStep.outputs.buildVersion }}
    timeout-minutes: 90
    steps:
      - name: Start timestamp
        continue-on-error: true
        timeout-minutes: 1
        if: always()
        run: |
          date -u
          df -h
          free -h || true

      - name: Get runner info
        continue-on-error: true
        timeout-minutes: 1
        if: always()
        run: |
          echo "############### Get OS and Hardware info step ###############"
          echo "=== ОС и ядро ==="
          cat /etc/os-release
          echo "=== ОС и ядро ==="
          cat /etc/os-release | grep -E "^(NAME|VERSION)="
          uname -r
          echo "=== Версия Ubuntu ==="
          lsb_release -a
          #
          echo -e "\n=== Память ==="
          free -h
          #Покажет:
          #    total — всего памяти.
          #    used / available — сколько занято и сколько доступно.
          #    buff/cache — память, используемая под кэш и буферы (это нормально и полезно).
          echo -e "\n=== Память ==="
          cat /proc/meminfo
          #
          echo -e "\n=== Swap ==="
          swapon --show || echo "Swap не настроен"
          #echo -e "\n=== Swap ==="
          #cat_file /proc/swaps
          #
          echo -e "\n=== CPU ==="
          lscpu # lscpu — подробная информация: модель CPU, количество сокетов, ядер на сокет, потоков, архитектура и т. п.
          echo -e "\n=== CPU ==="
          nproc # nproc — количество доступных процессорных ядер (то, что видит планировщик ОС).
          lscpu | grep -E "^(Model\ name|Socket|Core|Thread)"
          echo -e "\n=== Ядро и архитектура ==="
          uname -a
          echo -e "\n=== CPU ==="
          uname -m
          echo -e "\n=== CPU ==="
          cat /proc/cpuinfo
          #
          echo -e "\n=== Диски ==="
          lsblk

      - name: Deps
        timeout-minutes: 2
        run: |
          if ! command -v 7z >/dev/null 2>&1; then
            sudo apt-get update
            sudo apt-get install -y p7zip-full
          fi

      - name: Free Disk Space
        timeout-minutes: 6
        #v.1.3.1 - https://github.com/jlumbroso/free-disk-space/releases
        uses: jlumbroso/free-disk-space@3f13feab2962a87273d379ebc36ea159527e6cc9
        if: github.event_name == 'workflow_dispatch' && !inputs.restore_cache_from_R2
        with:
          tool-cache: true

      - name: Checkout Repository
        timeout-minutes: 2
        #v7.0.1 - https://github.com/actions/checkout/releases
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        if: github.event_name == 'workflow_dispatch' && !inputs.restore_cache_from_R2
        with:
          fetch-depth: 0

      - name: Restore cache from R2
        timeout-minutes: 1
        id: restore_cache_r2
        if: github.event_name == 'workflow_dispatch' && inputs.restore_cache_from_R2
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          cd ..
          if aws s3 cp "s3://$R2_BUCKET/cache.zip" cache.zip --endpoint-url $R2_ENDPOINT --quiet; then
            echo "Cache found, extracting..."
            unzip -q cache.zip -d ./Card-Game-Simulator_new/ && rm cache.zip
          else
            echo "Cache not found. Nothing to download - stop the job."
            exit 1
          fi
          rm -rf Card-Game-Simulator/
          mv Card-Game-Simulator_new/ Card-Game-Simulator/
          cd ./Card-Game-Simulator/

      #- name: Restore Library cache from R2
      # timeout-minutes: 1
      #  id: restore_library_cache
      #  env:
      #    AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
      #    AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
      #    AWS_DEFAULT_REGION: us-east-1
      #    R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
      #    R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
      #    CACHE_KEY: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectSettings.asset', 'ProjectSettings/ProjectVersion.txt', 'Assets/Settings/Build Profiles/Android_Release_APK.asset', 'Assets/Settings/Build Profiles/Android_Release_AAB.asset') }}
      #  run: |
      #    echo "Looking for cache: $CACHE_KEY"
      #    if aws s3 cp "s3://$R2_BUCKET/$CACHE_KEY" Library.tar.zst --endpoint-url $R2_ENDPOINT --quiet; then
      #      echo "Cache found, extracting..."
      #      tar -I zstd -xf Library.tar.zst
      #      rm Library.tar.zst
      #      source .github/scripts/helpers.sh
      #      check_folder ./
      #      check_folder "Library/"
      #      rm -rf Library/
      #    else
      #      echo "Cache not found. Nothing to download."
      #    fi

      - name: Cache Library
        timeout-minutes: 3
        #v6.1.0 - https://github.com/actions/cache/releases
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectSettings.asset', 'ProjectSettings/ProjectVersion.txt', 'Assets/Settings/Build Profiles/Android_Release_APK.asset', 'Assets/Settings/Build Profiles/Android_Release_AAB.asset') }}-${{ matrix.exportMode == 'apk' && 'apk' || 'aab' }}${{ inputs.use_cached_library == true && '' || '-new' }}
          restore-keys: |
            Library-Android-${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectSettings.asset', 'ProjectSettings/ProjectVersion.txt', 'Assets/Settings/Build Profiles/Android_Release_APK.asset', 'Assets/Settings/Build Profiles/Android_Release_AAB.asset') }}-${{ inputs.use_cached_library == true && '' || '-dontusecache' }}

      - name: Check hash codes
        timeout-minutes: 1
        run: |
          echo "=== Cache-key: ==="
          echo "Full cache-key:                   ${{ hashFiles('Packages/manifest.json', 'Packages/packages-lock.json', 'ProjectSettings/ProjectSettings.asset', 'ProjectSettings/ProjectVersion.txt', 'Assets/Settings/Build Profiles/Android_Release_APK.asset', 'Assets/Settings/Build Profiles/Android_Release_AAB.asset') }}"
          echo "Packages/:"
          echo "    /manifest.json:               ${{ hashFiles('Packages/manifest.json') }}"
          echo "    /packages-lock.json:          ${{ hashFiles('Packages/packages-lock.json') }}"
          echo "ProjectSettings/:"
          echo "    /ProjectSettings.asset:       ${{ hashFiles('ProjectSettings/ProjectSettings.asset') }}"
          echo "    /ProjectVersion.txt:          ${{ hashFiles('ProjectSettings/ProjectVersion.txt') }}"
          echo "Assets/Settings/Build Profiles/:"
          echo "    /Android_Release_AAB.asset:   ${{ hashFiles('Assets/Settings/Build Profiles/Android_Release_AAB.asset') }}"
          echo "    /Android_Release_APK.asset:   ${{ hashFiles('Assets/Settings/Build Profiles/Android_Release_APK.asset') }}"

      - name: Extract Build Versions (File or Input)
        timeout-minutes: 1
        id: buildVersions
        env:
          CUSTOM_BUILD_VERSION: ${{ inputs.custom_build_version }}
          EXPORT_MODE: ${{ matrix.exportMode }}
          IS_PRODUCTION: ${{ inputs.isProduction }} # helpers
          SENTRY_CLI_OPTIONS: ${{ secrets.SENTRY_CLI_OPTIONS }} # helpers
          PROJECT_SETTINGS_FILE: ${{ env.PROJECT_SETTINGS_FILE }} # helpers
          STORE: ${{ matrix.store }} # helpers
        run: |
          source .github/scripts/helpers.sh
          CUSTOM_VER="$CUSTOM_BUILD_VERSION"
          #
          DEST="$PROJECT_SETTINGS_FILE"
          cp "$DEST" "$DEST.bak"
          #
          set_sentry
          set_define_symbols
          set_prod
          tune_UniversalRenderPipelineGlobalSettings
          remove_ttf_files
          #
          mkdir -p "$GH_WS_R8PATH"
          mkdir -p "$TMP_R8_ANALYSIS_PATH"
          #
          rm -rf Assets/PlayModeTests/
          rm -rf Assets/Scripts/EditModeTests/
          #
          # --- Логика для VERSION (buildVersion.txt) ---
          if [ -n "$CUSTOM_VER" ]; then
            echo "Using custom build version from input: $CUSTOM_VER"
            BUILD_VERSION="$CUSTOM_VER"
            #
            # 2. Валидация формата X.Y.Z (три числа через точку)
            # Регулярка проверяет: начало строки, число, точка, число, точка, число, конец строки
            if ! [[ "$BUILD_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Error: Invalid version format '$BUILD_VERSION'. Expected format is X.Y.Z (e.g., 1.2.3)" >&2
              exit 1
            fi
            #
            # 3. Парсим X, Y, Z
            # Используем IFS (Internal Field Separator) для разбиения строки по точке
            IFS='.' read -r X Y Z <<< "$BUILD_VERSION"
            #
            # На всякий случай проверяем, что переменные не пустые (защита от странных багов)
            if [ -z "$X" ] || [ -z "$Y" ] || [ -z "$Z" ]; then
              echo "Error: Failed to parse version components from '$BUILD_VERSION'" >&2
              echo "major: $X"
              echo "minor: $Y"
              echo "patch: $Z"
              exit 1
            fi
            #
            # 4. Вычисляем ANDROID_VERSION_CODE
            ANDROID_CODE=$((X * 1000000 + Y * 1000 + Z))
            #
            echo "Parsed components: X=$X, Y=$Y, Z=$Z"
            echo "Calculated ANDROID_VERSION_CODE: $ANDROID_CODE"
          else
            ANDROID_CODE=$(cat ProjectSettings/androidVersionCode.txt | tr -d '[:space:]')
            BUILD_VERSION=$(cat ProjectSettings/buildVersion.txt | tr -d '[:space:]')
          fi
          #
          sed -i "s/^  bundleVersion: .*/  bundleVersion: $BUILD_VERSION/" "$DEST"
          sed -i "s/^  AndroidBundleVersionCode: .*/  AndroidBundleVersionCode: $ANDROID_CODE/" "$DEST"
          #
          PROJECT_BUILD_VERSION=$(grep -oP 'bundleVersion:\s*\K[\d.]+'        "$PROJECT_SETTINGS_FILE")
          PROJECT_ANDROID_CODE=$(grep -oP 'AndroidBundleVersionCode:\s*\K\d+' "$PROJECT_SETTINGS_FILE")
          #
          echo "VERSION=$PROJECT_BUILD_VERSION"                             >> "$GITHUB_ENV"
          echo "ANDROID_VERSION_CODE=$PROJECT_ANDROID_CODE"                 >> "$GITHUB_ENV"
          echo "VERSIONnExt=$PROJECT_ANDROID_CODE.$EXPORT_MODE"             >> "$GITHUB_ENV"
          echo "fullVERSIONnMODE=$PROJECT_ANDROID_CODE.$STORE.$EXPORT_MODE" >> "$GITHUB_ENV"

      - name: Show Using Variables
        timeout-minutes: 1
        env:
          ANDROID_EXPORT_TYPE: ${{ inputs.android_export_type }}
          CUSTOM_BUILD_VERSION: ${{ inputs.custom_build_version }}
          IS_PRODUCTION: ${{ inputs.isProduction }}
          PROJECT_SETTINGS_FILE: ${{ env.PROJECT_SETTINGS_FILE }}
          RESTORE_CACHE_FROM_R2: ${{ inputs.restore_cache_from_R2 }}
          SENTRY_SIZE_ANALYSIS_INPUT: ${{ inputs.sentry_size_analysis_enabled }}
          STORE_EXPORT_TYPE: ${{ inputs.store_export_type }}
          USE_CACHED_LIBRARY: ${{ inputs.use_cached_library }}
        run: |
          echo "=== Env vars: ==="
          echo "VERSION:                $VERSION"
          echo "ANDROID_VERSION_CODE:   $ANDROID_VERSION_CODE"
          echo "VERSIONnExt:            $VERSIONnExt"
          echo "fullVERSIONnMODE:       $fullVERSIONnMODE"
          echo "GRADLE_OPTS:            $GRADLE_OPTS"
          echo "GH_WS_R8PATH:           $GH_WS_R8PATH"
          echo "TMP_R8_ANALYSIS_PATH:   $TMP_R8_ANALYSIS_PATH"
          echo "LATEST_GRADLE:          $LATEST_GRADLE"
          echo "GRADLE_FOLDER_PATH:     $GRADLE_FOLDER_PATH"
          echo "GRADLE_BIN_FOLDER_PATH: $GRADLE_BIN_FOLDER_PATH"
          echo "GRADLE_BIN_PATH:        $GRADLE_BIN_PATH"
          echo "GRADLE_PROJECT:         $GRADLE_PROJECT"
          echo "GRADLE_REPORTS_FOLDER:  $GRADLE_REPORTS_FOLDER"
          echo "PROJECT_SETTINGS_FILE:  $PROJECT_SETTINGS_FILE"
          echo "GRADLE_PROBLEM_REPORT_FOLDER: $GRADLE_PROBLEM_REPORT_FOLDER"
          echo ""
          echo "=== Inputs: ==="
          echo "use_cached_library:           $USE_CACHED_LIBRARY"
          echo "restore_cache_from_R2:        $RESTORE_CACHE_FROM_R2"
          echo "custom_build_version:         $CUSTOM_BUILD_VERSION"
          echo "android_export_type:          $ANDROID_EXPORT_TYPE"
          echo "store_export_type:            $STORE_EXPORT_TYPE"
          echo "isProduction:                 $IS_PRODUCTION"
          echo "sentry_size_analysis_enabled: $SENTRY_SIZE_ANALYSIS_INPUT"

      - name: 📈 Install sentry-cli
        timeout-minutes: 1
        if: matrix.exportMode == 'aab'
        run: |
          curl -sL https://sentry.io/get-cli/ | bash
          echo "sentry-cli version: $(sentry-cli --version)"

      - name: Before build timestamp
        continue-on-error: true
        timeout-minutes: 1
        if: always()
        run: |
          date -u
          df -h
          free -h || true

      - name: 🦺 Build Android
        timeout-minutes: 90
        id: buildStep
        #v.5.0.1 - https://github.com/game-ci/unity-builder/releases
        uses: game-ci/unity-builder@adaf7cd8f42fd48fbbf2d4f5f67ca30d87f819f1
        env:
          ANDROID_KEYALIAS_PASS: ${{ secrets.ANDROID_KEYALIAS_PASS }}
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASS }}
          USYM_UPLOAD_AUTH_TOKEN: ${{ secrets.USYM_UPLOAD_AUTH_TOKEN }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL_PERSONAL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD_PERSONAL }}
          UNITY_SERIAL: ${{ secrets.UNITY_SERIAL_PERSONAL }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_SIZE_ANALYSIS_ENABLED: ${{ inputs.sentry_size_analysis_enabled && 'true' || 'false' }}
          R8_DUMP_KEEP_RADIUS: 'true'
        with:
          targetPlatform: Android
          customParameters: -SENTRY_AUTH_TOKEN "$SENTRY_AUTH_TOKEN" -SENTRY_ORG "$SENTRY_ORG" -SENTRY_PROJECT "$SENTRY_PROJECT"
          allowDirtyBuild: true
          versioning: Custom
          version: $VERSION
          androidVersionCode: $ANDROID_VERSION_CODE
          buildProfile: ${{ matrix.exportMode == 'apk' && 'Assets/Settings/Build Profiles/Android_Release_APK.asset' || 'Assets/Settings/Build Profiles/Android_Release_AAB.asset' }}
          androidExportType: ${{ matrix.exportMode == 'apk' && 'androidPackage' || 'androidAppBundle' }}
          androidKeystoreName: 'my-release-key.jks'
          androidKeystoreBase64: '$ANDROID_KEYSTORE_BASE64'
          androidKeystorePass: '$ANDROID_KEYSTORE_PASS'
          androidKeyaliasName: my-key-alias
          androidKeyaliasPass: '$ANDROID_KEYALIAS_PASS'
          androidTargetSdkVersion: AndroidApiLevel36

      - name: After build timestamp
        timeout-minutes: 1
        continue-on-error: true
        if: always() && steps.buildStep.outcome != 'skipped'
        run: |
          date -u
          df -h
          free -h || true

      #- name: Upload Build as GitHub artifact
      #  env:
      #    EXPORT_MODE: ${{ matrix.exportMode }}
      # timeout-minutes: 10
      #  #v7.0.1 - https://github.com/actions/upload-artifact/releases
      #  uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      #  if: steps.buildStep.outcome != 'skipped'
      #  with:
      #    path: build/Android
      #    name: cgs-Android-"$EXPORT_MODE"-"$ANDROID_VERSION_CODE"
      #    retention-days: 1

      - name: 🗜️ Upload Build to R2
        timeout-minutes: 2
        continue-on-error: true
        if: steps.buildStep.outcome != 'skipped'
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: us-east-1
          EXPORT_MODE: ${{ matrix.exportMode }}
          R2_BUCKET: ${{ secrets.R2_BUCKET_NAME }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
        run: |
          if [ ! -d "build/Android" ]; then
            echo "'build/Android' folder not found, skipping '$EXPORT_MODE' save."
            exit 1
          fi
          #
          source .github/scripts/helpers.sh
          DIR="artifacts/build/Android"
          SRC="${DIR}/Android.$EXPORT_MODE"
          DEST="${DIR}/$fullVERSIONnMODE"
          mkdir -p artifacts
          cp -r "build/" "artifacts/"
          mv "$SRC" "$DEST"
          #
          zst_file_name="$fullVERSIONnMODE.tar.zst"
          compress_zstd "$DIR" "artifacts/$zst_file_name" 9
          echo "Uploading '$zst_file_name' to R2..."
          time aws s3 cp "artifacts/$zst_file_name" "s3://$R2_BUCKET/$ANDROID_VERSION_CODE/$zst_file_name" --endpoint-url $R2_ENDPOINT --quiet
          echo "Uploading completed."

      - name: 📈 Create Sentry release
        timeout-minutes: 2
        continue-on-error: true
        if: steps.buildStep.outcome == 'success' && matrix.exportMode == 'aab'
        env:
          APP_NAME: ${{ secrets.APP_NAME }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_LOG_LEVEL_ARG: ${{ inputs.sentry_debug == true && '--log-level debug' || '' }}
        run: |
          AAB_FILE=$(find build -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            echo "All '*.aab' files found:"
            find build -name "*.aab"
            echo "Using: $AAB_FILE"
            #
            echo ""; echo "----- Creating Sentry release ($RELEASE_NAME) executed... -----"
            RELEASE_NAME="$APP_NAME@$VERSION ($ANDROID_VERSION_CODE)"
            time sentry-cli releases new "$RELEASE_NAME" \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              --finalize \
              $SENTRY_LOG_LEVEL_ARG
            echo "----- Creating Sentry release ($RELEASE_NAME) completed -----"; echo ""
          else
            echo "AAB file not found."
            exit 1
          fi

      - name: 📈 Upload AAB to Sentry for Size Tracking
        timeout-minutes: 2
        continue-on-error: true
        if: steps.buildStep.outcome == 'success' && matrix.exportMode == 'aab' && github.event_name == 'workflow_dispatch' && inputs.sentry_size_analysis_enabled
        env:
          HEAD_REPO_NAME: ${{ secrets.HEAD_REPO_NAME }}
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_LOG_LEVEL_ARG: ${{ inputs.sentry_debug == true && '--log-level debug' || '' }}
          SHA: ${{ github.sha }}
        run: |
          AAB_FILE=$(find build -name "*.aab" | head -n 1)
          if [ -n "$AAB_FILE" ]; then
            echo "All '*.aab' files found:"
            find build -name "*.aab"
            echo "Using: $AAB_FILE"
            #
            echo ""; echo "----- Uploading AAB to Sentry executed... -----"
            # https://docs.sentry.io/platforms/android/size-analysis/#uploading-with-the-sentry-cli
            time sentry-cli build upload "$AAB_FILE" \
              --org "$SENTRY_ORG" \
              --project "$SENTRY_PROJECT" \
              --build-configuration Release \
              --head-sha "$SHA" \
              --head-repo-name "$HEAD_REPO_NAME" \
              --vcs-provider github \
              --force-git-metadata \
              $SENTRY_LOG_LEVEL_ARG
            echo "----- Uploading AAB to Sentry completed -----"; echo ""
          else
            echo "AAB file not found."
            exit 1
          fi

